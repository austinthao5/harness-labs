service:
  name: remoteHelmServiceTest
  identifier: remoteHelmServiceTest
  orgIdentifier: CSE_Labs
  projectIdentifier: CSE_Lab_Project
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: nginx
            type: HelmChart
            spec:
              store:
                type: Http
                spec:
                  connectorRef: testconnhelm
              optionalValuesYaml: false
              chartName: nginx
              chartVersion: <+input>
              subChartPath: ""
              helmVersion: V3
              skipResourceVersioning: false
              enableDeclarativeRollback: false
              fetchHelmChartMetadata: false
    type: NativeHelm
